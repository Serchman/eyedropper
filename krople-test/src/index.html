<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <title>Krople</title>
  <link rel="stylesheet" href="main.css">
  <script type="module" src="main.js"></script>
</head>
<body>
  <header class="topbar">
    <span class="brand">Krople</span>
    <div class="topbar-actions">
      <button id="btn-quit" class="text-btn" type="button">Zakończ</button>
      <button id="btn-minimize" class="icon-btn" type="button" title="Minimalizuj" aria-label="Minimalizuj">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path d="M5 18h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>
        </svg>
      </button>
      <button id="btn-settings" class="icon-btn" type="button" title="Ustawienia" aria-label="Ustawienia" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2" fill="none"/>
          <path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>
        </svg>
      </button>
    </div>
  </header>

  <main class="content">
    <section id="settings" class="panel" hidden>
      <h2>Ustawienia</h2>
      <label class="field">
        <span>Czas oczekiwania, min</span>
        <input id="wait-minutes" type="number" min="1" max="120" step="1" value="15">
      </label>
      <label class="check">
        <input id="autostart" type="checkbox">
        <span>Uruchamiaj z Windows</span>
      </label>
      <p id="settings-status" class="status" role="status"></p>
    </section>

    <p class="placeholder">Tu będzie pełna aplikacja</p>

    <section class="panel">
      <div class="controls">
        <button id="btn-add-30" type="button">Dodaj timer 30 s</button>
        <button id="btn-add-120" type="button">Dodaj timer 2 min</button>
        <button id="btn-expire" type="button" class="danger">Wymuś koniec</button>
      </div>
      <ul id="timer-list" class="timers"></ul>
      <p id="empty" class="empty">Brak timerów</p>
    </section>
  </main>
</body>
</html>
