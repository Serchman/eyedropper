<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <title>Krople</title>
  <link rel="stylesheet" href="main.css">
  <script type="module" src="main.js"></script>
</head>
<body>
  <main class="page">
    <div class="add-row">
      <div class="name-field">
        <label for="name">Inicjały lub imię</label>
        <input id="name" type="text" placeholder="np. A.K." maxlength="20" autocomplete="off" autofocus>
      </div>
      <button id="add-one" class="add-btn" type="button">1 kropla</button>
      <button id="add-three" class="add-btn" type="button">3 krople co 10 min</button>
      <div class="spacer"></div>
      <button id="btn-minimize" class="icon-btn" type="button" title="Minimalizuj" aria-label="Minimalizuj">
        <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true">
          <path d="M5 18h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>
        </svg>
      </button>
      <button id="btn-settings" class="icon-btn" type="button" title="Ustawienia" aria-label="Ustawienia">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.830 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>

    <div id="cards" class="cards"></div>
    <p id="empty" class="empty">Brak pacjentów</p>

    <!-- Shown in place of the cards when the gear is used. -->
    <section id="settings-view" class="settings-view" aria-labelledby="settings-title" hidden>
      <div class="settings-head">
        <h2 id="settings-title" class="settings-title">Ustawienia</h2>
        <button id="btn-back" class="add-btn btn-secondary" type="button">Wróć</button>
      </div>
      <div class="settings-fields">
        <div class="field">
          <label for="interval-minutes">Odstęp między kroplami, min</label>
          <input id="interval-minutes" class="number-input" type="number" min="1" max="60" step="1" inputmode="numeric">
        </div>
        <div class="field">
          <label for="wait-minutes">Czas oczekiwania, min</label>
          <input id="wait-minutes" class="number-input" type="number" min="1" max="120" step="1" inputmode="numeric">
        </div>
      </div>
      <label class="check">
        <input id="autostart" type="checkbox">
        Uruchamiaj z Windows
      </label>
      <p id="settings-status" class="settings-status" role="status"></p>
      <div class="settings-quit">
        <button id="btn-quit" class="add-btn" type="button">Zakończ</button>
      </div>
    </section>
  </main>
</body>
</html>
